[project]
name = "majiang-support"
version = "0.1.0"
description = "Sichuan Mahjong decision engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mahjong-detector==0.0.6",
]

[project.scripts]
majiang = "majiang_support.app.cli:main"
majiang-web = "majiang_support.app.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
