<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>川麻辅助 V2</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>川麻辅助 V2</h1>
          <p>点击牌面加入手牌，也可以拖拽调整顺序。确认后会用路线 EV 给出推荐。</p>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="handCount">0 / 14</span>
          <span id="stateText">等待输入</span>
        </div>
      </header>

      <section class="workspace">
        <div class="input-panel">
          <section class="controls" aria-label="规则设置">
            <label>
              定缺
              <select id="missingSuit">
                <option value="">未选择</option>
                <option value="m">万</option>
                <option value="p">筒</option>
                <option value="s">条</option>
              </select>
            </label>
            <button id="sortHand" type="button">一键排序</button>
            <button id="suggestMissing" type="button">推荐定缺</button>
            <button id="randomHand" type="button">随机 14 张</button>
            <button id="clearHand" type="button">清空</button>
            <button id="analyze" class="primary" type="button">确认分析</button>
          </section>

          <section class="action-controls" aria-label="动作推荐">
            <label>
              当前场景
              <select id="actionScene">
                <option value="after_draw">我摸牌后</option>
                <option value="after_discard">别人打牌后</option>
              </select>
            </label>
            <label>
              别人打出的牌
              <select id="incomingTile"></select>
            </label>
            <button id="analyzeAction" class="primary" type="button">分析碰杠</button>
          </section>

          <section class="hand-zone" aria-label="我的手牌">
            <div class="section-title">
              <h2>我的手牌</h2>
              <span>需要 14 张</span>
            </div>
            <div id="hand" class="hand" aria-label="已输入手牌"></div>
            <div class="drop-hint">把牌拖到这里；点击手牌可移除</div>
          </section>

          <section class="tile-picker" aria-label="牌池">
            <div class="section-title">
              <h2>牌池</h2>
              <span>每种最多 4 张</span>
            </div>
            <div id="tilePool" class="tile-pool"></div>
          </section>

          <section class="screenshot-panel" aria-label="截图导入">
            <div class="section-title">
              <h2>截图导入</h2>
              <span>实验功能</span>
            </div>
            <div class="screenshot-controls">
              <label class="file-picker">
                上传截图
                <input id="screenshotInput" type="file" accept="image/*" />
              </label>
              <button id="scanScreenshot" type="button">识别截图</button>
              <button id="importScreenshotHand" type="button">导入截图手牌</button>
            </div>
            <div id="screenshotPreview" class="screenshot-preview"></div>
            <div class="capture-grid-wrap">
              <h3>手牌截图</h3>
              <div id="handCaptures" class="capture-grid"></div>
            </div>
            <div class="capture-grid-wrap">
              <h3>疑似已打出的牌</h3>
              <div id="discardCaptures" class="capture-grid"></div>
            </div>
          </section>
        </div>

        <aside class="result-panel" aria-label="分析结果">
          <div class="section-title">
            <h2>输出结果</h2>
            <span id="resultStamp">未分析</span>
          </div>
          <div id="result" class="result empty">
            输入 14 张手牌并点击确认分析，推荐结果会显示在这里。
          </div>
        </aside>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
